[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaa-xai"
version = "25.12.0"
description = "KAA is a framework allowing to apply several explainability methods and metrics from several dedicated libraries on AI model to verify them."
readme = "README.md"
license = { file = "LICENCE" }
authors = [
    { name = "Philippe Dejean", email = "philippe.dejean@irt-saintexupery.com" },
]
requires-python = ">=3.9,<3.11"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "colorama==0.4.6",
    "psutil==5.9.7",
    "pandas==1.5.3",
    "numba==0.56.4",
    "numpy==1.23.5",
    "imgaug==0.4.0",
    "albumentations==1.1.0",
    "seaborn==0.11.2",
    "scikit-image==0.19.0",
    "scikit-learn==1.2.2",
    "shapely==1.8.2",
    "protobuf==3.19.6",
    "tensorflow==2.9.0",
    "torchvision==0.19.1",
    "torch==2.4.1",
    "spacy==3.7.2",
    "spacy-lookups-data==1.0.5",
    "opencv-python==4.6.0.66",
    "Pillow==9.1.1",
    "requests==2.28.0",
    "pathlib==1.0.1",
    "PyYAML==6.0",
    "matplotlib==3.7.5",
    "datasets==2.11.0",
    "transformers==4.10.0",
    "sentencepiece==0.1.98",
    "sentence_transformers==2.2.2",
    "ultralytics==8.3.231",
    "tqdm==4.66.1",
    "huggingface-hub==0.25.0",
    "cvxpy==1.5.2",
]

[project.urls]
Homepage = "https://github.com/IRT-Saint-Exupery/KAA"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaa*"]

[tool.setuptools.package-data]
"kaa.kaasrc" = ["ressources/*"]
